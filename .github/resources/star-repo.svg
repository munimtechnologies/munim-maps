<svg xmlns="http://www.w3.org/2000/svg" width="640" height="112" viewBox="0 0 640 112" role="img" aria-label="Enjoying Munim Technologies? Star the repo on GitHub">
  <title>Enjoying Munim Technologies? Star the repo on GitHub</title>
  <style>
    .label { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
    .button-text { font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .button { fill: #21262d; stroke: #3d444d; stroke-width: 1.5; animation: glow 3s ease-in-out infinite; }
    .star { fill: #8b949e; transform-origin: 452px 56px; animation: star 3s ease-in-out infinite; }
    @keyframes star {
      0%, 35% { fill: #8b949e; transform: scale(1); }
      45% { fill: #e3b341; transform: scale(1.25); }
      55%, 85% { fill: #e3b341; transform: scale(1); }
      100% { fill: #8b949e; transform: scale(1); }
    }
    @keyframes glow {
      0%, 35% { fill: #21262d; }
      45%, 85% { fill: #2a2f37; }
      100% { fill: #21262d; }
    }
  </style>
  <rect width="640" height="112" rx="16" fill="#0d1117"/>
  <text class="label" x="32" y="65" textLength="372" lengthAdjust="spacingAndGlyphs">Enjoying Munim Technologies?</text>
  <rect class="button" x="424" y="26" width="188" height="60" rx="12"/>
  <path class="star" d="M452 38.5l5.1 10.4 11.4 1.6-8.3 8.1 2 11.4L452 64.6 441.8 70l2-11.4-8.3-8.1 11.4-1.6z"/>
  <text class="button-text" x="480" y="64" textLength="112" lengthAdjust="spacingAndGlyphs">Star Repo</text>
</svg>
