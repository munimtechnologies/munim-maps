name: Build Android

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-build.yml'
      - 'package*.json'
      - 'example/**'
      - 'packages/munim-maps/android/**'
      - 'packages/munim-maps/nitrogen/**'
      - 'packages/munim-maps/src/**'
      - 'packages/munim-maps/scripts/**'
      - 'packages/munim-maps/app.plugin.js'
      - 'packages/munim-maps/cesium/**'
      - 'packages/munim-maps/nitro.json'
      - 'packages/munim-maps/package.json'
  pull_request:
    paths:
      - '.github/workflows/android-build.yml'
      - 'package*.json'
      - 'example/**'
      - 'packages/munim-maps/android/**'
      - 'packages/munim-maps/nitrogen/**'
      - 'packages/munim-maps/src/**'
      - 'packages/munim-maps/scripts/**'
      - 'packages/munim-maps/app.plugin.js'
      - 'packages/munim-maps/cesium/**'
      - 'packages/munim-maps/nitro.json'
      - 'packages/munim-maps/package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android example (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MapLibre only
            providers: ''
          - name: every engine
            providers: google,mapbox,maplibre,cesium
    env:
      MUNIM_MAPS_PROVIDERS: ${{ matrix.providers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-audit --no-fund
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
        working-directory: example
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: example/android
